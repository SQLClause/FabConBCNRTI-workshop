name: Publish attendee labs

# Mirrors the attendee-facing subset of both halves of the day into the private brianbonk/FabConIQLabs
# repo, keeping the source layout so cross-links between the halves keep working:
#
#   RTI/       Real-Time Intelligence half (first, Modules 00-07): modules, artifacts, prerequisites,
#              screenshots. Presenter-only docs/, infra/ and README.md are left out.
#   FabricIQ/  Fabric IQ half (second, Modules 08-14): setup, modules, artifacts, prerequisites,
#              screenshots. Presenter-only docs/, slides/, SESSION_MEMORY.md, README.md,
#              artifacts/**/HOW-TO-EXPORT.md and assets/screenshots/fallback/ are left out.
#   README.md  Built from README-attendee.md at the root of this repo.
#
# Each half's README-attendee.md becomes that folder's README.md.
#
# The destination repo's entire content is generated by this workflow: each run wipes everything except
# .git and rebuilds it from the current source, then commits only if something actually changed.

on:
  push:
    branches: [main]
    paths:
      - "FabricIQ/setup/**"
      - "FabricIQ/modules/**"
      - "FabricIQ/artifacts/**"
      - "FabricIQ/prerequisites/**"
      - "FabricIQ/assets/screenshots/**"
      - "FabricIQ/README-attendee.md"
      - "RTI/modules/**"
      - "RTI/artifacts/**"
      - "RTI/prerequisites/**"
      - "RTI/assets/screenshots/**"
      - "RTI/README-attendee.md"
      - "README-attendee.md"
      - ".github/workflows/publish-attendee-labs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-attendee-labs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (this repo)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout destination (brianbonk/FabConBCNLabs)
        uses: actions/checkout@v4
        with:
          repository: brianbonk/FabConBCNLabs
          token: ${{ secrets.FABCONIQLABS_PUSH_TOKEN }}
          path: dest
          fetch-depth: 0

      - name: Build attendee bundle
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source"
          DEST="$GITHUB_WORKSPACE/dest"

          # This repo's whole purpose is to hold the generated bundle -- wipe everything
          # except .git and rebuild from scratch each run, so removed/renamed files don't
          # linger from a previous sync.
          find "$DEST" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # git doesn't track empty directories (e.g. assets/screenshots/* has no captured
          # screenshots yet), so a source folder can legitimately be missing from the
          # checkout. Skip it rather than fail -- it'll start syncing the moment it has
          # real content.
          safe_rsync() {
            local src="$1" dst="$2"; shift 2
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              rsync -a --exclude=".DS_Store" --exclude=".gitkeep" "$@" "$src/" "$dst/"
            else
              echo "Skipping missing source dir: $src"
            fi
          }

          # --- RTI half (Modules 00-07) ---
          safe_rsync "$SRC/RTI/modules" "$DEST/RTI/modules"
          safe_rsync "$SRC/RTI/artifacts" "$DEST/RTI/artifacts"
          safe_rsync "$SRC/RTI/prerequisites" "$DEST/RTI/prerequisites"
          safe_rsync "$SRC/RTI/assets/screenshots" "$DEST/RTI/assets/screenshots" --exclude="fallback/"
          cp "$SRC/RTI/README-attendee.md" "$DEST/RTI/README.md"

          # --- Fabric IQ half (Modules 08-14) ---
          safe_rsync "$SRC/FabricIQ/setup" "$DEST/FabricIQ/setup"
          safe_rsync "$SRC/FabricIQ/modules" "$DEST/FabricIQ/modules"
          safe_rsync "$SRC/FabricIQ/artifacts" "$DEST/FabricIQ/artifacts" --exclude="HOW-TO-EXPORT.md"
          safe_rsync "$SRC/FabricIQ/prerequisites" "$DEST/FabricIQ/prerequisites"
          safe_rsync "$SRC/FabricIQ/assets/screenshots" "$DEST/FabricIQ/assets/screenshots" --exclude="fallback/"
          cp "$SRC/FabricIQ/README-attendee.md" "$DEST/FabricIQ/README.md"

          cp "$SRC/README-attendee.md" "$DEST/README.md"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          cd dest
          git config user.name "fabconiq-labs-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No attendee-visible changes -- nothing to publish."
            exit 0
          fi
          git commit -m "Sync attendee materials from SQLClause/FabConBCNRTI-workshop@${GITHUB_SHA::7}"
          git push origin HEAD:master
