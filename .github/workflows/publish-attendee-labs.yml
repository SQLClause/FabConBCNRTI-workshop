name: Publish attendee labs

# Mirrors the attendee-facing subset of FabricIQ/ (setup, labs, sample artifacts, screenshots,
# prerequisites) into the private brianbonk/FabConIQLabs repo. Presenter-only material
# (docs/facilitator-guide.md, docs/risk-fallback-plan.md, BUILD_PLAN.md, SESSION_MEMORY.md, plan.md,
# slides/, docs/agenda.md, artifacts/**/HOW-TO-EXPORT.md, assets/screenshots/fallback/) is deliberately
# left out -- see FabricIQ/README-attendee.md for what attendees actually see.
#
# The destination repo's entire content is generated by this workflow: each run wipes everything except
# .git and rebuilds it from the current source, then commits only if something actually changed.

on:
  push:
    branches: [main]
    paths:
      - "FabricIQ/setup/**"
      - "FabricIQ/modules/**"
      - "FabricIQ/artifacts/**"
      - "FabricIQ/prerequisites/**"
      - "FabricIQ/assets/screenshots/**"
      - "FabricIQ/README-attendee.md"
      - ".github/workflows/publish-attendee-labs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-attendee-labs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (this repo)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout destination (brianbonk/FabConIQLabs)
        uses: actions/checkout@v4
        with:
          repository: brianbonk/FabConIQLabs
          token: ${{ secrets.FABCONIQLABS_PUSH_TOKEN }}
          path: dest
          fetch-depth: 0

      - name: Build attendee bundle
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/FabricIQ"
          DEST="$GITHUB_WORKSPACE/dest"

          # This repo's whole purpose is to hold the generated bundle -- wipe everything
          # except .git and rebuild from scratch each run, so removed/renamed files don't
          # linger from a previous sync.
          find "$DEST" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          rsync -a --exclude=".DS_Store" "$SRC/setup/" "$DEST/setup/"
          rsync -a --exclude=".DS_Store" "$SRC/modules/" "$DEST/modules/"
          rsync -a --exclude=".DS_Store" --exclude="HOW-TO-EXPORT.md" "$SRC/artifacts/" "$DEST/artifacts/"
          rsync -a --exclude=".DS_Store" "$SRC/prerequisites/" "$DEST/prerequisites/"
          mkdir -p "$DEST/assets"
          rsync -a --exclude=".DS_Store" --exclude="fallback/" "$SRC/assets/screenshots/" "$DEST/assets/screenshots/"
          cp "$SRC/README-attendee.md" "$DEST/README.md"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          cd dest
          git config user.name "fabconiq-labs-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No attendee-visible changes -- nothing to publish."
            exit 0
          fi
          git commit -m "Sync attendee materials from SQLClause/FabConBCNRTI-workshop@${GITHUB_SHA::7}"
          git push origin HEAD:main
